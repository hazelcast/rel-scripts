name: Validate Python

on:
  pull_request:
    paths:
      - '.github/python/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: psf/black@4f1883b1f15305a0e83a7c87991f46292bf09f85 # 26.10.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pip3 install pytest
          pip3 install -r .github/python/add-release/requirements.txt

      - name: Run tests
        run: |
          pytest .github/python/add-release/tests
